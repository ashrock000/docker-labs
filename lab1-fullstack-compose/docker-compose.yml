version: '3.8'

services:
  database:
    build: ./database
    container_name: lab1-database
    volumes:
      - sqlite_data:/data
    networks:
      - app-network
    restart: always

  backend:
    build: ./backend
    container_name: lab1-backend
    environment:
      DB_HOST: database
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fullstackdb
      PORT: 3000
    depends_on:
      - database
    networks:
      - app-network
    restart: always

  frontend:
    build: ./frontend
    container_name: lab1-frontend
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

volumes:
  sqlite_data:

networks:
  app-network:
    driver: bridge
