events {}

http {
    upstream app1 {
        server app1:3001;
    }

    upstream app2 {
        server app2:3002;
    }

    server {
        listen 80;

        location /app1/ {
            proxy_pass http://app1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /app2/ {
            proxy_pass http://app2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
